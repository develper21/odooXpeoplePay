services:
  - type: web
    name: peoplepay360-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: peoplepay360-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAMESITE
        value: lax

databases:
  - name: peoplepay360-db
    plan: free
    databaseName: odoopeoplepay
    user: odoopeoplepay_user
